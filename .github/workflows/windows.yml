name: Windows build, test and package
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Check Windows PowerShell 5.1 syntax
        shell: powershell
        run: |
          Get-ChildItem scripts/*.ps1 | ForEach-Object {
            $tokens = $null; $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors)
            if ($errors.Count) { throw ($errors | Out-String) }
          }
      - name: Build, test and package
        shell: pwsh
        run: ./scripts/Build.ps1
      - name: Windows Service installation smoke test
        timeout-minutes: 5
        shell: pwsh
        run: ./scripts/Smoke-Windows.ps1
      - name: Sign stable update manifest
        if: github.event_name != 'pull_request'
        shell: pwsh
        env:
          ZIYIN_RELEASE_SIGNING_KEY: ${{ secrets.ZIYIN_RELEASE_SIGNING_KEY }}
        run: ./scripts/Sign-Release.ps1
      - name: Signed upgrade and rollback smoke test
        if: github.event_name != 'pull_request'
        timeout-minutes: 10
        shell: pwsh
        run: ./scripts/Smoke-Update.ps1
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-test-results
          path: tests/**/TestResults/*.trx
          if-no-files-found: warn
          retention-days: 14
      - name: Upload Windows download
        uses: actions/upload-artifact@v4
        with:
          name: ziyin-windows-client-win-x64
          path: |
            artifacts/ziyin-windows-client-win-x64.zip
            artifacts/SHA256SUMS.txt
            artifacts/update.json
            artifacts/update.json.sig
          if-no-files-found: error
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ziyin-windows-client-win-x64
          path: release-assets
      - name: Publish stable release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          test "$RELEASE_TAG" = "v$(cat VERSION | tr -d '\r\n')"
          gh release create "$RELEASE_TAG" --verify-tag --latest --title "紫音 Windows 客户端 $RELEASE_TAG" --notes-file docs/RELEASE-NOTES.md release-assets/ziyin-windows-client-win-x64.zip release-assets/SHA256SUMS.txt release-assets/update.json release-assets/update.json.sig
