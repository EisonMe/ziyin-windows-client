name: Windows build, test and package
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Check Windows PowerShell 5.1 syntax
        shell: powershell
        run: |
          Get-ChildItem scripts/*.ps1 | ForEach-Object {
            $tokens = $null; $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors)
            if ($errors.Count) { throw ($errors | Out-String) }
          }
      - name: Build, test and package
        shell: pwsh
        run: ./scripts/Build.ps1
      - name: Windows Service installation smoke test
        timeout-minutes: 5
        shell: pwsh
        run: ./scripts/Smoke-Windows.ps1
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-test-results
          path: tests/**/TestResults/*.trx
          if-no-files-found: warn
          retention-days: 14
      - name: Upload Windows download
        uses: actions/upload-artifact@v4
        with:
          name: ziyin-windows-client-win-x64
          path: |
            artifacts/ziyin-windows-client-win-x64.zip
            artifacts/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
